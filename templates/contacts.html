{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <h1 class="text-center mb-4">Напишіть мені</h1>
        <form class="p-4 border rounded bg-white shadow-sm">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="name@example.com">
            </div>
            <div class="mb-3">
                <label for="msg" class="form-label">Повідомлення</label>
                <textarea class="form-control" id="msg" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">Відправити</button>
        </form>
    </div>
</div>
{% endblock %}
